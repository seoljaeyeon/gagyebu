<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가계부</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="theme-color" content="#f3f5f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* layout: one-screen mobile app — sticky month header, scrolling body, bottom tab bar, slide-up entry sheet */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#6b7684; --line:#e3e7ec;
  --accent:#1f4e78; --accent-soft:#e3ecf5;
  --inc:#1f6fd1; --exp:#c62f2f; --sav:#13855c; --bad:#c62f2f; --bad-soft:#fdeaea; --sav-soft:#e2f4ec;
  --font:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --surface:#18202a; --ink:#e8edf2; --muted:#93a0ae; --line:#283340;
    --accent:#7fb0e0; --accent-soft:#1d2f42;
    --inc:#6aa9f0; --exp:#f07272; --sav:#4cc596; --bad:#f07272; --bad-soft:#3a1f22; --sav-soft:#16332a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#18202a; --ink:#e8edf2; --muted:#93a0ae; --line:#283340;
  --accent:#7fb0e0; --accent-soft:#1d2f42;
  --inc:#6aa9f0; --exp:#f07272; --sav:#4cc596; --bad:#f07272; --bad-soft:#3a1f22; --sav-soft:#16332a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-size:19px;margin:0;font-weight:700;min-width:118px;text-align:center}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--line)}
.status{font-size:12px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:0 16px 110px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.card h2{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:600}
.banner{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:10px;font-size:13px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.totals .lab{font-size:12px;color:var(--muted)}
.totals .val{font-size:18px;font-weight:600}
.totals .big{grid-column:1/-1;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.totals .big .val{font-size:22px}
.c-inc{color:var(--inc)} .c-exp{color:var(--exp)} .c-sav{color:var(--sav)} .c-bad{color:var(--bad)}
.filters{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.day{display:flex;flex-direction:column}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:4px 2px 6px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:transparent;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--bg)}
.tag{flex:none;font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;background:var(--line);color:var(--muted)}
.tag.inc{background:var(--accent-soft);color:var(--inc)}
.tag.sav{background:var(--sav-soft);color:var(--sav)}
.tag.exp{background:var(--bad-soft);color:var(--exp)}
.row .mid{flex:1;min-width:0}
.row .t1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:28px 0;font-size:14px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line)}
.bar-row:first-of-type{border-top:0}
.bar-row .n{font-size:14px;font-weight:500}
.bar-row .v{font-size:13px;text-align:right}
.bar-row .s{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.track{grid-column:1/-1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px}
.fill.over{background:var(--bad)} .fill.sav{background:var(--sav)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi .lab{font-size:12px;color:var(--muted)}
.kpi .val{font-size:24px;font-weight:700}
.kpi .sub{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
svg text{fill:var(--muted);font-size:10px;font-family:var(--font)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:max(16px, calc(50% - 264px));bottom:calc(env(safe-area-inset-bottom) + 74px);width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--surface);font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.18)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);display:none;z-index:10}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:92%;overflow-y:auto;transform:translateY(105%);transition:transform .22s ease;z-index:11;display:flex;flex-direction:column;gap:14px}
.sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h3{margin:0;font-size:17px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:9px 0;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on[data-v="지출"]{color:var(--exp)} .seg button.on[data-v="수입"]{color:var(--inc)} .seg button.on[data-v="저축"]{color:var(--sav)}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px}
.amount-in{font-size:26px!important;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{padding:7px 12px}
.chips .chip.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:600;background:var(--accent);color:var(--surface)}
.btn.ghost{flex:none;background:var(--bad-soft);color:var(--bad);padding:14px 18px}
.btn:disabled{opacity:.45}
.err{color:var(--bad);font-size:13px;min-height:1em}
/* settings */
.set-list{display:flex;flex-direction:column;gap:8px}
.set-item{display:flex;gap:6px;align-items:center}
.set-item input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px}
.set-item input.money{flex:none;width:92px;text-align:right;font-variant-numeric:tabular-nums}
.del{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:18px}
.add{margin-top:10px;border:1px dashed var(--line);background:transparent;border-radius:9px;padding:9px;width:100%;color:var(--accent);font-weight:500}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.viewbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg2{display:inline-grid;grid-template-columns:1fr 1fr;width:auto}
.seg2 button{padding:6px 14px;font-size:13px}
.cal{padding:10px 4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0}
.cal-dow{text-align:center;font-size:11px;color:var(--muted);padding:2px 0 6px}
.sun{color:var(--bad)!important} .sat{color:var(--inc)!important}
.cal-cell{border:1px solid transparent;background:transparent;border-radius:8px;min-height:62px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden}
.cal-cell:active{background:var(--bg)}
.cal-cell.today .cal-d{background:var(--accent);color:var(--surface)!important;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.cal-cell.sel{border-color:var(--accent);background:var(--accent-soft)}
.cal-d{font-size:13px;font-weight:500;line-height:22px}
.cal-a{font-size:clamp(7.5px,2.3vw,12px);line-height:1.3;letter-spacing:-.45px;white-space:nowrap;max-width:100%}
.set-item .mv{display:flex;flex-direction:column;flex:none}
.set-item .mv button{border:0;background:transparent;color:var(--muted);font-size:9px;width:22px;height:17px;padding:0;line-height:1}
.set-item .mv button:disabled{opacity:.25}
.set-item.confirm{background:var(--bad-soft);border-radius:9px;padding:8px 10px}
.cmsg{flex:1;font-size:13px;color:var(--ink)} .cmsg small{color:var(--muted)}
.mini{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500}
.mini.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.mini.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.add-bar{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.add-bar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px}
.add-bar input.money{flex:none;width:96px;text-align:right}
.asset-row{display:flex;flex-direction:column;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.asset-row:last-child{border-bottom:0}
.alink{display:flex;align-items:center;gap:8px;padding-left:28px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.alink select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 6px;font-size:12px;max-width:170px}
.aopts{display:flex;flex-wrap:wrap;gap:6px 14px;padding-left:28px;font-size:12px;color:var(--muted)}
.aopts .chip{padding:3px 9px;font-size:12px}
.aopts .chip.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.aopts .grp{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.aopts input.tiny{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 6px;font-size:12px;width:76px}
.alink input.tiny{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 6px;font-size:12px;width:64px}
.rng{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:-2px}
.tag.trf{background:var(--line);color:var(--muted)} .c-trf{color:var(--muted)}
.tag.fix{background:var(--accent-soft);color:var(--accent);margin-left:4px;font-size:10px;padding:1px 5px}
.quick{flex:none;display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick .chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 12px;border-radius:12px;color:var(--ink)}
.quick .chip small{font-size:10.5px;color:var(--muted)}
.daily{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.daily .lab{color:var(--accent);font-size:12px} .daily .val{font-size:18px;font-weight:700;color:var(--accent);white-space:nowrap}
.daily .sub{font-size:11px;color:var(--muted);display:block}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 0}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.diff{font-size:11px;margin-left:4px;font-weight:500}
.diff.up{color:var(--exp)} .diff.down{color:var(--sav)}
.searchbox{display:flex;gap:8px;align-items:center}
.searchbox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.icon-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:32px;display:grid;place-items:center;color:var(--muted)}
.icon-chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rec-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.rec-row:first-child{border-top:0}
.rec-row .mid{flex:1;min-width:0;font-size:13px}
.rec-row .mid b{font-weight:600} .rec-row .mid small{display:block;color:var(--muted);font-size:11.5px}
.rec-row input.money{width:96px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 140px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="month">
      <button class="icon-btn" id="prev" aria-label="이전 달"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h1 id="title" class="num">2026년 11월</h1>
      <button class="icon-btn" id="next" aria-label="다음 달"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <span class="status" id="status"></span>
  </header>
  <main id="main"></main>
</div>

<button class="fab" id="fab" aria-label="내역 추가">+</button>

<nav class="tabs"><div class="in">
  <button data-tab="list" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>내역</button>
  <button data-tab="sum"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>요약</button>
  <button data-tab="asset"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6"/><path d="M5 10v9M9.5 10v9M14.5 10v9M19 10v9M3 20h18"/></svg>자산</button>
  <button data-tab="set"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<form class="sheet" id="sheet" autocomplete="off">
  <div class="sheet-h"><h3 id="sheetTitle">내역 추가</h3><button type="button" class="icon-btn" id="closeSheet" aria-label="닫기">✕</button></div>
  <div class="seg" id="fType">
    <button type="button" data-v="지출">지출</button>
    <button type="button" data-v="수입">수입</button>
    <button type="button" data-v="저축">저축</button>
    <button type="button" data-v="이체">이체</button>
  </div>
  <div class="field"><label for="fAmount">금액(원)</label><input id="fAmount" class="amount-in" inputmode="numeric" placeholder="0"></div>
  <div class="field" id="fCatWrap"><label>항목</label><div class="chips" id="fCat"></div></div>
  <div class="two">
    <div class="field"><label for="fDate">날짜</label><input id="fDate" type="date"></div>
    <div class="field"><label for="fMemo">내용</label><input id="fMemo" placeholder="예: 편의점"></div>
  </div>
  <div class="field"><label id="fPayLab">결제수단</label><div class="chips" id="fPay"></div></div>
  <div class="field" id="fToWrap" hidden><label>받는 곳</label><div class="chips" id="fTo"></div></div>
  <div class="field"><label for="fNote">메모 (선택)</label><input id="fNote"></div>
  <div id="fOpts">
    <label class="chk"><input type="checkbox" id="fRepeat"> 매달 이 날짜에 자동 입력 (고정 지출·수입)</label>
    <label class="chk"><input type="checkbox" id="fFav"> 빠른 입력 버튼으로 저장</label>
  </div>
  <div class="err" id="fErr"></div>
  <div class="actions">
    <button type="button" class="btn ghost" id="fDel" hidden>삭제</button>
    <button type="submit" class="btn" id="fSave">저장</button>
  </div>
</form>
<div class="toast" id="toast"></div>

<script>
(function(){
const DEFAULTS = {
  income:["급여","부업","용돈/기타수입","이자/환급"],
  expense:["식비","외식/카페","주거/관리비","통신","교통","생활용품","의료/건강","취미","경조사/선물","보험","구독","기타"].map(n=>({name:n,budget:0})),
  saving:["적금","청약","투자","비상금","기타저축"],
  pay:["현금","체크카드","신용카드","계좌이체"],
  saveTarget:0
};
const now = new Date();
const S = {db:null, settings:null, settingsVer:false, txs:[], y:now.getFullYear(), m:now.getMonth()+1,
  tab:"list", view:"list", selDay:now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0"), filter:"전체", loaded:false, editing:null, form:null};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => (Math.round(n)||0).toLocaleString("ko-KR");
const pad = n => String(n).padStart(2,"0");
const ymKey = (y,m) => y+"-"+pad(m);
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const DOW = ["일","월","화","수","목","금","토"];
const cfg = () => S.settings || DEFAULTS;
const expNames = () => cfg().expense.map(e=>e.name);

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800); }
function setStatus(s){ $("status").textContent = s; }

/* ---------- data ---------- */
const fmtD = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function startDay(){ return Math.min(28, Math.max(1, +cfg().startDay||1)); }
// 월급날 기준 한 달: (y,m)월 = m월 시작일 ~ 다음 달 시작일 전날
// 월급이 주말·공휴일이면 그 전 평일에 들어오는 경우: 시작일을 앞당김
function prevBizDay(ds){ const d=new Date(ds+"T00:00:00"); while(d.getDay()===0 || d.getDay()===6 || HOLIDAYS.has(fmtD(d))) d.setDate(d.getDate()-1); return fmtD(d); }
function periodStart(y,m){ const sd=startDay(); const ds=fmtD(new Date(y,m-1,sd)); return (sd>1 && cfg().startPrev) ? prevBizDay(ds) : ds; }
function periodRange(y,m){ const [ny,nm] = m===12?[y+1,1]:[y,m+1]; const e=new Date(periodStart(ny,nm)+"T00:00:00"); e.setDate(e.getDate()-1); return [periodStart(y,m), fmtD(e)]; }
function periodOf(ds){ const [y,m]=ds.split("-").map(Number); if(ds>=periodStart(y,m)) return [y,m]; return m===1?[y-1,12]:[y,m-1]; }
function monthTx(y,m){ const [a,b]=periodRange(y,m); return S.txs.filter(t=>t.date && t.date>=a && t.date<=b); }
function prevYM(y,m){ return m===1?[y-1,12]:[y,m-1]; }
function sums(list){
  const r={수입:0,지출:0,저축:0};
  list.forEach(t=>{ if(r[t.type]!==undefined) r[t.type]+=Number(t.amount)||0; });
  return r;
}

/* ---------- render ---------- */
function render(){
  if(S.tab==="asset") $("title").textContent = "재산 현황";
  else { const [pa,pb]=periodRange(S.y,S.m); $("title").innerHTML = S.y+"년 "+S.m+"월" + (startDay()>1? `<span class="rng">${+pa.slice(5,7)}.${+pa.slice(8)} ~ ${+pb.slice(5,7)}.${+pb.slice(8)}</span>`:""); }
  $("prev").style.visibility = $("next").style.visibility = S.tab==="asset" ? "hidden" : "";
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===S.tab));
  $("fab").hidden = S.tab==="set" || S.tab==="asset";
  const main=$("main");
  let html = "";
  if(S.installTip) html += `<div class="banner" style="background:var(--accent-soft);color:var(--accent)">Safari 아래 공유 버튼 → <b>홈 화면에 추가</b> 후 그 아이콘으로 쓰세요. Safari 탭에서 입력한 내용은 홈 화면 앱과 따로 저장돼요.</div>`;
  if(!LocalStore.ok()) html += `<div class="banner">이 브라우저에서는 저장할 수 없어요. 개인정보 보호 브라우징을 끄고 열어주세요.</div>`;
  if(S.slow) html += `<div class="banner">데이터를 아직 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</div>`;
  if(S.tab==="list") html += renderList();
  else if(S.tab==="sum") html += renderSum();
  else if(S.tab==="asset") html += renderAsset();
  else html += renderSet();
  // 다시 그릴 때 입력 중이던 칸의 값과 커서를 유지
  const keep = {}; main.querySelectorAll("input[id]").forEach(el=>{ if(el.type!=="file") keep[el.id]=el.value; });
  const act = document.activeElement && main.contains(document.activeElement) && document.activeElement.id ? document.activeElement.id : null;
  if(S.composing && act) return; // 한글 조합 중에는 다시 그리지 않음 (글자 깨짐 방지)
  let selS=null, selE=null; try{ if(act){ selS=document.activeElement.selectionStart; selE=document.activeElement.selectionEnd; } }catch(e){}
  main.innerHTML = html;
  Object.keys(keep).forEach(id=>{ const el=$(id); if(el && (id.startsWith("new") || id===act)) el.value=keep[id]; });
  const fid = S.refocus || act; S.refocus = null;
  if(fid){ const el=$(fid); if(el){ el.focus({preventScroll:true}); try{ if(fid===act && selS!=null) el.setSelectionRange(selS, selE); }catch(e){} } }
}

function dayGroups(list, withYear){
  let h = "";
  const groups = {};
  list.forEach(t=>{ (groups[t.date]=groups[t.date]||[]).push(t); });
  Object.keys(groups).forEach(d=>{
    const dt = new Date(d+"T00:00:00");
    const g = groups[d], out = g.filter(t=>t.type==="지출").reduce((a,t)=>a+(+t.amount||0),0);
    h += `<div class="day"><div class="day-h"><span>${withYear&&dt.getFullYear()!==now.getFullYear()?dt.getFullYear()+"년 ":""}${dt.getMonth()+1}월 ${dt.getDate()}일 (${DOW[dt.getDay()]})</span><span class="num c-exp">${out?"지출 "+won(out):""}</span></div><div class="rows">`;
    g.forEach(t=>{
      const cls = t.type==="수입"?"inc":t.type==="저축"?"sav":t.type==="이체"?"trf":"exp";
      const sign = t.type==="수입"?"+":t.type==="지출"?"−":"";
      const unknown = (t.type==="지출" && !expNames().includes(t.cat)) || (t.type==="수입" && !cfg().income.includes(t.cat)) || (t.type==="저축" && !cfg().saving.includes(t.cat));
      h += `<button class="row" data-edit="${esc(t.id)}">
        <span class="tag ${cls}">${esc(t.type)}</span>
        <span class="mid"><div class="t1">${esc(t.memo||t.cat)}${t.recur?'<span class="tag fix">고정</span>':""}</div><div class="t2">${t.type==="이체"? esc((t.pay||"")+" → "+(t.toPay||"")) : esc(t.cat)+(unknown?" · 목록에 없는 항목":"")+(t.pay?" · "+esc(t.pay):"")}${t.note?" · "+esc(t.note):""}</div></span>
        <span class="amt num c-${cls}">${sign}${won(t.amount)}</span></button>`;
    });
    h += `</div></div>`;
  });
  return h;
}
const shortWon = n => won(n);
const sortTx = l => l.sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0));

function renderCal(list){
  const [a,b] = periodRange(S.y,S.m), sd = startDay();
  const start = new Date(a+"T00:00:00"), end = new Date(b+"T00:00:00");
  const per = {};
  list.forEach(t=>{ const p=(per[t.date]=per[t.date]||{수입:0,지출:0,저축:0}); if(p[t.type]!==undefined) p[t.type]+=(+t.amount||0); });
  const today = todayStr();
  let h = `<section class="card cal"><div class="cal-grid">${DOW.map((d,i)=>`<div class="cal-dow ${i===0?"sun":i===6?"sat":""}">${d}</div>`).join("")}`;
  for(let i=0;i<start.getDay();i++) h += `<div></div>`;
  for(const d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const key = fmtD(d), p = per[key], dow=d.getDay();
    const label = sd>1 && (d.getDate()===1 || key===a) ? (d.getMonth()+1)+"/"+d.getDate() : d.getDate();
    h += `<button class="cal-cell ${key===today?"today":""} ${key===S.selDay?"sel":""}" data-day="${key}" aria-label="${d.getMonth()+1}월 ${d.getDate()}일">
      <span class="cal-d ${dow===0?"sun":dow===6?"sat":""}">${label}</span>
      ${p&&p.지출?`<span class="cal-a num c-exp">-${shortWon(p.지출)}</span>`:""}
      ${p&&p.수입?`<span class="cal-a num c-inc">+${shortWon(p.수입)}</span>`:""}
      ${p&&p.저축?`<span class="cal-a num c-sav">${shortWon(p.저축)}</span>`:""}
    </button>`;
  }
  h += `</div><div class="legend" style="justify-content:center;margin-top:6px"><span><i style="background:var(--exp)"></i>지출</span><span><i style="background:var(--inc)"></i>수입</span><span><i style="background:var(--sav)"></i>저축</span></div></section>`;
  if(S.selDay && S.selDay>=a && S.selDay<=b){
    const dayList = sortTx(list.filter(t=>t.date===S.selDay));
    h += dayList.length ? dayGroups(dayList) : `<div class="empty">이 날 적은 내역이 없어요.</div>`;
  }else{
    h += `<div class="empty" style="padding:12px 0">날짜를 누르면 그날 내역이 보여요.</div>`;
  }
  return h;
}

/* 하루 쓸 수 있는 돈: (예산 − 이번 달 지출 − 아직 안 나간 고정지출) ÷ 남은 날 */
function dailyAllowance(list, s){
  const c=cfg(), budget=c.expense.reduce((a,e)=>a+(+e.budget||0),0);
  if(!budget) return null;
  const [a,b]=periodRange(S.y,S.m), today=todayStr();
  if(today<a || today>b) return null;
  let upcoming=0;
  (c.recurring||[]).filter(r=>!r.off && r.type==="지출").forEach(r=>{
    [[S.y,S.m],[S.m===12?S.y+1:S.y, S.m===12?1:S.m+1]].forEach(([y,m])=>{
      const date=recurDate(r,y,m);
      if(date>today && date>=a && date<=b && !S.txs.some(t=>t.id==="rec-"+r.id+"-"+y+pad(m))) upcoming+=(+r.amount||0);
    });
  });
  const days = Math.round((new Date(b+"T00:00:00")-new Date(today+"T00:00:00"))/86400000)+1;
  const remain = budget - s.지출 - upcoming;
  const spentToday = list.filter(t=>t.type==="지출" && t.date===today).reduce((x,t)=>x+(+t.amount||0),0);
  return {perDay: Math.max(0, Math.floor(remain/days)), remain, days, upcoming, spentToday};
}

function renderQuick(){
  const q = cfg().quick||[];
  if(!q.length) return "";
  return `<div class="quick">${q.map((x,i)=>`<button class="chip" data-quick="${i}"><span>${esc(x.memo||x.cat)}</span><small>${esc(x.type==="이체"?(x.pay+"→"+(x.toPay||"")):x.cat+(x.pay?" · "+x.pay:""))}</small></button>`).join("")}</div>`;
}

function renderSearch(){
  const q=(S.q||"").trim();
  let h = `<div class="searchbox"><input id="q" type="search" placeholder="내용, 항목, 메모로 검색 (전체 기간)" value="${esc(S.q||"")}" enterkeyhint="search"></div>`;
  if(!q) return h + `<div class="empty">검색어를 입력하세요.</div>`;
  const words=q.toLowerCase().split(/\s+/);
  const hits = sortTx(S.txs.filter(t=>{ const hay=[t.memo,t.cat,t.note,t.pay,t.toPay,t.type].join(" ").toLowerCase(); return words.every(w=>hay.includes(w)); }));
  const s=sums(hits);
  h += `<section class="card"><div class="totals">
    <div><div class="lab">찾은 내역</div><div class="val num">${hits.length}건</div></div>
    <div><div class="lab">지출 합계</div><div class="val num c-exp">${won(s.지출)}</div></div>
    ${s.수입?`<div><div class="lab">수입 합계</div><div class="val num c-inc">${won(s.수입)}</div></div>`:""}
    ${s.저축?`<div><div class="lab">저축 합계</div><div class="val num c-sav">${won(s.저축)}</div></div>`:""}
  </div></section>`;
  return h + (hits.length? dayGroups(hits, true) : `<div class="empty">찾은 내역이 없어요.</div>`);
}

function renderList(){
  const list = monthTx(S.y,S.m);
  const s = sums(list);
  const left = s.수입-s.지출-s.저축;
  const searchBtn = `<button class="icon-chip ${S.searching?"on":""}" data-search="1" aria-label="검색"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>`;
  if(S.searching){
    return `<div class="viewbar">${searchBtn}<span class="lab" style="font-size:13px;color:var(--muted)">검색 닫기</span></div>` + renderSearch();
  }
  const da = dailyAllowance(list, s);
  let h = `<section class="card"><div class="totals">
    <div><div class="lab">수입</div><div class="val num c-inc">${won(s.수입)}</div></div>
    <div><div class="lab">지출</div><div class="val num c-exp">${won(s.지출)}</div></div>
    <div><div class="lab">저축</div><div class="val num c-sav">${won(s.저축)}</div></div>
    <div><div class="lab">저축률</div><div class="val num">${s.수입? Math.round((s.저축+left)/s.수입*1000)/10+"%":"-"}</div></div>
    <div class="big"><span class="lab">남은 돈 (수입−지출−저축)</span><span class="val num ${left<0?"c-bad":""}">${won(left)}원</span></div>
  </div>${da?`<div class="daily"><span><span class="lab">오늘 하루 쓸 수 있는 돈</span><span class="sub num">남은 예산 ${won(da.remain)}${da.upcoming?` (고정지출 ${won(da.upcoming)} 제외)`:""} · ${da.days}일 남음${da.spentToday?` · 오늘 ${won(da.spentToday)} 씀`:""}</span></span><span class="val num ${da.remain<0?"c-bad":""}">${won(da.perDay)}원</span></div>`:""}</section>`;
  h += renderQuick();
  h += `<div class="viewbar"><div class="seg seg2">${[["list","목록"],["cal","달력"]].map(([v,l])=>`<button data-view="${v}" class="${S.view===v?"on":""}">${l}</button>`).join("")}</div>${searchBtn}`;
  if(S.view!=="cal") h += `<div class="filters">${["전체","지출","수입","저축","이체"].map(f=>`<button class="chip ${S.filter===f?"on":""}" data-filter="${f}">${f}</button>`).join("")}</div>`;
  h += `</div>`;
  if(S.view==="cal") return h + renderCal(list);
  const shown = sortTx(list.filter(t=>S.filter==="전체"||t.type===S.filter));
  if(!shown.length){
    h += `<div class="empty">${S.loaded? "이 달에 적은 내역이 없어요.<br>+ 버튼으로 추가하세요." : "불러오는 중…"}</div>`;
    return h;
  }
  return h + dayGroups(shown);
}

function renderSum(){
  const list = monthTx(S.y,S.m), s = sums(list), c = cfg();
  const left = s.수입-s.지출-s.저축;
  const rate = s.수입 ? (s.저축+left)/s.수입 : null;
  const goal = c.saveTarget ? s.저축/c.saveTarget : null;
  let h = `<section class="card"><h2>이번 달 저축</h2><div class="kpis">
    <div class="kpi"><div class="lab">저축률</div><div class="val num">${rate===null?"-":(Math.round(rate*1000)/10)+"%"}</div><div class="sub">(저축+남은 돈) ÷ 수입</div></div>
    <div class="kpi"><div class="lab">저축 목표 달성</div><div class="val num c-sav">${goal===null?"-":Math.round(goal*100)+"%"}</div><div class="sub num">${won(s.저축)} / ${won(c.saveTarget)}원</div></div>
  </div>${goal!==null?`<div class="track" style="margin-top:12px"><div class="fill sav" style="width:${Math.min(100,goal*100)}%"></div></div>`:""}</section>`;

  // budgets
  const byCat = {};
  list.filter(t=>t.type==="지출").forEach(t=>{ byCat[t.cat]=(byCat[t.cat]||0)+(+t.amount||0); });
  const totalBudget = c.expense.reduce((a,e)=>a+(+e.budget||0),0);
  const [py,pm] = prevYM(S.y,S.m), plist = monthTx(py,pm), pS = sums(plist), pCat = {};
  plist.filter(t=>t.type==="지출").forEach(t=>{ pCat[t.cat]=(pCat[t.cat]||0)+(+t.amount||0); });
  const hasPrev = plist.length>0;
  const diff = (cur,prev) => { const d=cur-prev; return !hasPrev||!d ? "" : `<span class="diff ${d>0?"up":"down"}">${d>0?"▲":"▼"}${won(Math.abs(d))}</span>`; };
  h += `<section class="card"><h2>지난달과 비교</h2><div class="totals">
    <div><div class="lab">이번 달 지출</div><div class="val num c-exp">${won(s.지출)}</div></div>
    <div><div class="lab">지난달(${pm}월) 지출</div><div class="val num">${hasPrev?won(pS.지출):"-"}</div></div>
    <div class="big"><span class="lab">차이</span><span class="val num ${s.지출>pS.지출?"c-exp":"c-sav"}">${hasPrev?(s.지출>=pS.지출?"+":"−")+won(Math.abs(s.지출-pS.지출))+"원":"-"}</span></div>
  </div></section>`;
  h += `<section class="card"><h2>항목별 예산 · 지출 <span class="c-exp">${won(s.지출)}</span> / 예산 ${won(totalBudget)}원</h2>`;
  c.expense.forEach(e=>{
    const used = byCat[e.name]||0, b=+e.budget||0, rem=b-used, over = b>0 && used>b;
    const pct = b>0 ? Math.min(100, used/b*100) : (used>0?100:0);
    h += `<div class="bar-row"><span class="n">${esc(e.name)}</span><span class="v num ${used?"c-exp":""}">${won(used)}${diff(used,pCat[e.name]||0)}</span>
      <div class="track"><div class="fill ${over||(!b&&used)?"over":""}" style="width:${pct}%"></div></div>
      <div class="s num"><span>예산 ${b?won(b):"없음"}</span><span class="${rem<0?"c-bad":""}">${b?(rem<0?"초과 "+won(-rem):"남음 "+won(rem)):""}</span></div></div>`;
  });
  const orphan = Object.keys(byCat).filter(k=>!expNames().includes(k));
  orphan.forEach(k=>{
    h += `<div class="bar-row"><span class="n">${esc(k)} <span class="tag">목록에 없음</span></span><span class="v num">${won(byCat[k])}</span></div>`;
  });
  h += `</section>`;

  // savings by item
  const sav = {};
  list.filter(t=>t.type==="저축").forEach(t=>{ sav[t.cat]=(sav[t.cat]||0)+(+t.amount||0); });
  const savKeys = Object.keys(sav);
  h += `<section class="card"><h2>저축 항목별</h2>`;
  if(!savKeys.length) h += `<div class="empty" style="padding:8px 0">이 달 저축 내역이 없어요.</div>`;
  savKeys.sort((a,b)=>sav[b]-sav[a]).forEach(k=>{
    h += `<div class="bar-row"><span class="n">${esc(k)}</span><span class="v num c-sav">${won(sav[k])}</span>
    <div class="track"><div class="fill sav" style="width:${s.저축? sav[k]/s.저축*100:0}%"></div></div></div>`;
  });
  h += `</section>`;

  // pay methods
  const pay = {};
  list.filter(t=>t.type==="지출").forEach(t=>{ const k=t.pay||"미지정"; pay[k]=(pay[k]||0)+(+t.amount||0); });
  const pk = Object.keys(pay).filter(k=>pay[k]>0).sort((a,b)=>pay[b]-pay[a]);
  if(pk.length){
    h += `<section class="card"><h2>결제수단별 지출</h2>`;
    pk.forEach(k=>{ h += `<div class="bar-row"><span class="n">${esc(k)}</span><span class="v num c-exp">${won(pay[k])}</span>
      <div class="track"><div class="fill" style="width:${pay[k]/s.지출*100}%"></div></div></div>`; });
    h += `</section>`;
  }

  // year chart
  h += `<section class="card"><h2>${S.y}년 월별 흐름</h2>${yearChart()}
    <div class="legend"><span><i style="background:var(--inc)"></i>수입</span><span><i style="background:var(--exp)"></i>지출</span><span><i style="background:var(--sav)"></i>저축</span></div></section>`;
  return h;
}

function yearChart(){
  const data = [];
  for(let m=1;m<=12;m++) data.push(sums(monthTx(S.y,m)));
  const max = Math.max(1, ...data.flatMap(d=>[d.수입,d.지출,d.저축]));
  const step = niceStep(max/3), top = Math.ceil(max/step)*step;
  const W=340,H=170,L=34,B=20,T=8, cw=(W-L)/12, bw=Math.min(7,(cw-4)/3);
  const y = v => T + (H-T-B)*(1-v/top);
  let g = "";
  for(let v=0; v<=top+1e-6; v+=step){
    g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v>=10000? Math.round(v/10000)+"만": v}</text>`;
  }
  data.forEach((d,i)=>{
    const x0 = L + i*cw + (cw-bw*3-2)/2;
    [["수입","var(--inc)"],["지출","var(--exp)"],["저축","var(--sav)"]].forEach(([k,col],j)=>{
      const v=d[k]; if(!v) return;
      g += `<rect x="${x0+j*(bw+1)}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="1.5" fill="${col}"/>`;
    });
    g += `<text x="${L+i*cw+cw/2}" y="${H-5}" text-anchor="middle" ${i+1===S.m?'style="fill:var(--ink);font-weight:600"':""}>${i+1}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${S.y}년 월별 수입, 지출, 저축">${g}</svg>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }

/* ---------- 재산 현황 ---------- */
const ASSET_KINDS = ["자산","부채"];
// 연결된 항목의 내역 중, 마지막으로 금액을 직접 맞춘 뒤(baseAt 이후)에 입력된 것만 자동 반영
function linkOptions(kind){
  const c=cfg();
  return kind==="부채" ? c.expense.map(e=>"지출|"+e.name) : ["통장|"].concat(c.saving.map(n=>"저축|"+n));
}
// 통장: 고른 결제수단으로 들어오고 나간 돈(수입 +, 지출·저축 −)
function bankTx(x){
  const at=x.baseAt||0, pays=x.pays||[];
  return S.txs.filter(t=>(t.createdAt||0) > at && (pays.includes(t.pay) || (t.type==="이체" && pays.includes(t.toPay))));
}
function bankFlow(x){
  const pays=x.pays||[]; let inn=0, out=0;
  bankTx(x).forEach(t=>{ const v=+t.amount||0;
    if(t.type==="이체"){ if(pays.includes(t.toPay)) inn+=v; if(pays.includes(t.pay)) out+=v; }
    else if(t.type==="수입") inn+=v; else out+=v; });
  return {inn,out};
}
function linkedTx(x){
  if(!x.link || x.link==="통장|") return [];
  const [type,cat] = x.link.split("|"), at = x.baseAt||0, kw=(x.kw||"").trim();
  return S.txs.filter(t=>t.type===type && t.cat===cat && (t.createdAt||0) > at && (!kw || (t.memo||"").includes(kw) || (t.note||"").includes(kw)))
    .sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
}
// 부채: 연 이자율이 있으면 원리금균등으로 보고 납부액 = 이자(잔액×연이율/12) + 원금, 원금만 차감
function loanCalc(x){
  let bal = x.base ?? x.balance ?? 0, principal=0, interest=0;
  const r = (+x.rate||0)/100/12;
  linkedTx(x).forEach(t=>{
    const pay=+t.amount||0;
    if(x.grace && t.date.slice(0,7) < x.grace){ interest+=pay; return; } // 거치 기간: 이자만 납부
    const it = r? Math.min(pay, Math.round(bal*r)) : 0, pr = Math.min(bal, pay-it);
    interest+=it; principal+=pr; bal-=pr;
  });
  return {principal, interest};
}
function assetDelta(x){
  if(!x.link) return 0;
  if(x.kind==="부채") return -loanCalc(x).principal;
  if(x.link==="통장|"){ const F=bankFlow(x); return F.inn-F.out; }
  return linkedTx(x).reduce((a,t)=>a+(+t.amount||0),0);
}
function assetBalance(x){ return (x.base ?? x.balance ?? 0) + assetDelta(x); }
function assetTotals(list){
  let a=0,l=0; (list||[]).forEach(x=>{ const b=assetBalance(x); if(x.kind==="부채") l+=b; else a+=b; });
  return {a,l,net:a-l};
}
function rebase(x, value){ x.base=value; x.balance=value; x.baseAt=Date.now(); x.updatedAt=Date.now(); }
function renderAsset(){
  const c = cfg(), list = c.assets||[], T = assetTotals(list);
  const last = list.reduce((m,x)=>Math.max(m,x.updatedAt||0),0);
  let h = `<section class="card"><div class="totals">
    <div class="big" style="border-top:0;padding-top:0"><span class="lab">순자산 (자산−부채)</span><span class="val num ${T.net<0?"c-bad":""}">${won(T.net)}원</span></div>
    <div><div class="lab">자산</div><div class="val num c-inc">${won(T.a)}</div></div>
    <div><div class="lab">부채</div><div class="val num c-exp">${won(T.l)}</div></div>
  </div>${last?`<p class="hint" style="margin-top:12px">마지막 수정 ${new Date(last).toLocaleDateString("ko-KR")}</p>`:""}</section>`;
  ASSET_KINDS.forEach(kind=>{
    const rows = list.map((x,i)=>({x,i})).filter(o=>(o.x.kind||"자산")===kind);
    const sub = rows.reduce((s,o)=>s+assetBalance(o.x),0);
    h += `<section class="card"><h2>${kind} <span class="num ${kind==="부채"?"c-exp":"c-inc"}" style="float:right">${won(sub)}</span></h2><div class="set-list">`;
    if(!rows.length) h += `<div class="empty" style="padding:6px 0">${kind==="자산"?"통장, 적금, 투자, 보증금 등을 추가하세요.":"대출, 카드값 등을 추가하세요."}</div>`;
    rows.forEach(({x,i},k)=>{
      if(S.confirmDel==="asset:"+i){
        h += `<div class="set-item confirm"><span class="cmsg"><b>${esc(x.name)}</b> 삭제할까요?</span><button class="mini danger" data-adelyes="${i}">삭제</button><button class="mini" data-delno="1">취소</button></div>`;
        return;
      }
      const opts = linkOptions(kind); if(x.link && !opts.includes(x.link)) opts.push(x.link);
      const delta = assetDelta(x);
      let delText = "";
      if(kind==="부채" && x.link){ const L=loanCalc(x); if(L.principal||L.interest) delText = '<span class="num c-exp">원금 −'+won(L.principal)+' 반영됨'+(L.interest? ' · 이자 '+won(L.interest) : '')+'</span>'; }
      else if(x.link==="통장|"){ const {inn,out}=bankFlow(x);
        if(inn||out) delText = '<span class="num"><span class="c-inc">+'+won(inn)+'</span> · <span class="c-exp">−'+won(out)+'</span> 반영됨</span>'; }
      else if(delta) delText = '<span class="num c-sav">+'+won(delta)+' 반영됨</span>';
      h += `<div class="asset-row"><div class="set-item"><div class="mv"><button data-amv="${i}" data-d="-1" aria-label="위로" ${k===0?"disabled":""}>▲</button><button data-amv="${i}" data-d="1" aria-label="아래로" ${k===rows.length-1?"disabled":""}>▼</button></div>
        <input value="${esc(x.name)}" data-aname="${i}" aria-label="이름">
        <input class="money" style="width:118px" inputmode="numeric" value="${won(assetBalance(x))}" data-abal="${i}" aria-label="${esc(x.name)} 금액">
        <button class="del" data-adel="${i}" aria-label="${esc(x.name)} 삭제">✕</button></div>
        <div class="alink"><label for="alink-${i}">자동 연결</label><select id="alink-${i}" data-alink="${i}"><option value="">없음</option>${opts.map(o=>`<option value="${esc(o)}" ${o===x.link?"selected":""}>${o==="통장|"?"통장 (결제수단 기준)":esc(o.replace("|"," · "))}</option>`).join("")}</select></div>${x.link==="통장|"?`<div class="aopts"><span>결제수단</span>${cfg().pay.map(pm=>`<button class="chip ${(x.pays||[]).includes(pm)?"on":""}" data-apay="${i}" data-v="${esc(pm)}">${esc(pm)}</button>`).join("")}</div>`:""}${kind==="부채"&&x.link?`<div class="aopts">
          <label class="grp" for="akw-${i}"><span>구분 단어</span><input id="akw-${i}" class="tiny" data-akw="${i}" value="${esc(x.kw||"")}" placeholder="예: 국민"></label>
          <label class="grp" for="arate-${i}"><span>연 이자율</span><input id="arate-${i}" class="tiny num" style="width:52px" inputmode="decimal" data-arate="${i}" value="${x.rate==null?"":x.rate}" placeholder="0"><span>%</span></label>
          <label class="grp" for="agrace-${i}"><span>거치 끝</span><input id="agrace-${i}" type="month" class="tiny" style="width:128px" data-agrace="${i}" value="${esc(x.grace||"")}"></label>
        </div>`:""}${delText?`<div class="alink">${delText}</div>`:""}</div>`;
    });
    h += `</div><div class="add-bar"><input id="new-asset-${kind}" placeholder="${kind==="자산"?"예: 국민 통장":"예: 전세대출"}" enterkeyhint="done"><input class="money" id="newb-asset-${kind}" inputmode="numeric" placeholder="금액" enterkeyhint="done"><button class="mini primary" data-aadd="${kind}">추가</button></div><p class="hint">${kind==="자산"?"통장은 「통장 (결제수단 기준)」을 고르고 그 통장에서 돈이 나가는 결제수단(체크카드, 계좌이체 등)을 켜세요. 그 결제수단으로 적은 수입은 더하고 지출·저축은 빼요. 적금·투자는 저축 항목을 연결하면 저축할 때마다 늘어나요.":"납부하는 지출 항목을 연결하면 낼 때마다 부채가 줄어요. 연 이자율을 넣으면 원리금균등으로 보고 납부액에서 이자를 뺀 원금만 줄여요. 같은 항목에 대출이 여러 개면 「구분 단어」에 내역 내용에 들어가는 단어를 넣으세요. 그 단어가 들어간 내역만 반영돼요. 이자만 내는 기간이 있으면 「거치 끝」에 원리금 상환이 시작되는 달을 넣으세요. 그 전 납부는 이자로만 계산하고 원금은 줄이지 않아요."} 금액을 직접 고치면 그 금액부터 다시 계산해요.</p></section>`;
  });
  // 순자산 추이
  const hist = Object.assign({}, c.netHistory||{});
  if(list.length){ const d=new Date(); hist[d.getFullYear()+"-"+pad(d.getMonth()+1)] = {net:T.net}; }
  const keys = Object.keys(hist).sort().slice(-12);
  if(keys.length){
    const vals = keys.map(k=>hist[k].net);
    const max = Math.max(1,...vals.map(Math.abs)), step=niceStep(max/3), top=Math.ceil(max/step)*step, hasNeg = vals.some(v=>v<0);
    const W=340,H=160,L=40,B=20,T0=8, lo = hasNeg? -top:0, cw=(W-L)/Math.max(keys.length,6), bw=Math.min(18,cw*0.6);
    const y = v => T0 + (H-T0-B)*(top-v)/(top-lo);
    let g="";
    for(let v=lo; v<=top+1e-6; v+=step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${Math.abs(v)>=10000? Math.round(v/10000).toLocaleString("ko-KR")+"만": v}</text>`;
    keys.forEach((k,i)=>{ const v=hist[k].net, x=L+i*cw+(cw-bw)/2, y0=y(0), y1=y(v);
      g += `<rect x="${x}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y0-y1))}" rx="2" fill="${v<0?"var(--exp)":"var(--accent)"}"/><text x="${x+bw/2}" y="${H-5}" text-anchor="middle">${+k.slice(5)}월</text>`; });
    h += `<section class="card"><h2>월별 순자산</h2><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="월별 순자산">${g}</svg><p class="hint">이번 달은 현재 순자산, 지난달은 그 달 마지막으로 기록된 순자산이에요.</p></section>`;
  }
  return h;
}

async function saveFile(name, text, mime){
  const blob = new Blob([text], {type:mime});
  try{
    const file = new File([blob], name, {type:mime});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const url = URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function exportCsv(){
  const rows = [["날짜","구분","항목","내용","금액(원)","결제수단","메모","받는곳"]];
  S.txs.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0))
    .forEach(t=>rows.push([t.date,t.type,t.cat,t.memo||"",t.amount,t.pay||"",t.note||"",t.toPay||""]));
  const csv = "﻿" + rows.map(r=>r.map(v=>{ v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(",")).join("\r\n");
  saveFile("가계부_"+todayStr()+".csv", csv, "text/csv");
}
function exportJson(){
  const tx = {}; S.txs.forEach(t=>{ const {id,...b}=t; tx[id]=b; });
  saveFile("가계부백업_"+todayStr()+".json", JSON.stringify({app:"gagyebu",version:1,savedAt:new Date().toISOString(),settings:cfg(),tx}), "application/json");
}
function parseCsv(text){
  text = text.replace(/^﻿/,""); const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===","){row.push(f);f="";} else if(c==="\n"){row.push(f);rows.push(row);row=[];f="";} else if(c!=="\r") f+=c; }
  if(f||row.length){row.push(f);rows.push(row);} return rows;
}

      const add = {};
      rows.forEach((r,i)=>{
        const t={date:r[0].trim(), type:r[1].trim(), cat:r[2].trim(), memo:(r[3]||"").trim(), amount:parseMoney(r[4]), pay:(r[5]||"").trim(), note:(r[6]||"").trim(), toPay:(r[7]||"").trim(), createdAt:Date.now()+i};
        if(!/^\d{4}-\d{2}-\d{2}$/.test(t.date) || !["수입","지출","저축","이체"].includes(t.type) || !t.amount) return;
        if(have.has(key(t))) return; have.add(key(t));
        add["imp"+Date.now().toString(36)+i]=t; n++;
      });
      LocalStore.addMany(add);
      toast(n? "내역 "+n+"건을 추가했어요" : "추가할 새 내역이 없어요");
    }
  }catch(err){ toast("파일을 읽지 못했어요. 이 앱에서 저장한 파일인지 확인하세요."); }
});


/* ---------- 고정 내역 자동 입력 ---------- */
// 은행 휴무일(관공서 공휴일·대체공휴일). 2026~2027년분, 이후는 주말만 계산
const HOLIDAYS = new Set(("2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-01 2026-03-02 2026-05-01 2026-05-05 2026-05-24 2026-05-25 2026-06-03 2026-06-06 2026-07-17 2026-08-15 2026-08-17 2026-09-24 2026-09-25 2026-09-26 2026-10-03 2026-10-05 2026-10-09 2026-12-25 "+
  "2027-01-01 2027-02-06 2027-02-07 2027-02-08 2027-02-09 2027-03-01 2027-05-01 2027-05-03 2027-05-05 2027-05-13 2027-06-06 2027-07-17 2027-07-19 2027-08-15 2027-08-16 2027-09-14 2027-09-15 2027-09-16 2027-10-03 2027-10-04 2027-10-09 2027-10-11 2027-12-25 2027-12-27").split(" "));
function bizDay(ds){ const d=new Date(ds+"T00:00:00"); while(d.getDay()===0 || d.getDay()===6 || HOLIDAYS.has(fmtD(d))) d.setDate(d.getDate()+1); return fmtD(d); }
function recurDate(r,y,m){ const nominal=y+"-"+pad(m)+"-"+pad(Math.min(r.day,new Date(y,m,0).getDate())); return r.shift===false ? nominal : bizDay(nominal); }
let recurBusy=false;
async function runRecurring(){
  if(recurBusy) return; recurBusy=true;
  try{
    const c=clone(cfg()), rules=c.recurring||[]; if(!rules.length) return;
    const today=todayStr(); let changed=false, made=0;
    for(const r of rules){
      if(r.off) continue;
      let [y,m]=(r.last||today.slice(0,7)).split("-").map(Number);
      for(let guard=0; guard<36; guard++){
        m++; if(m>12){m=1;y++;}
        const date=recurDate(r,y,m), d=+date.slice(8), [dy,dm]=date.split("-").map(Number);
        if(date>today) break;
        const id="rec-"+r.id+"-"+y+pad(m);
        if(!S.txs.some(t=>t.id===id)){
          await S.txCol.doc(id).set({date,type:r.type,cat:r.cat,memo:r.memo||"",amount:+r.amount||0,pay:r.pay||"",toPay:r.toPay||"",note:r.note||"",createdAt:new Date(dy,dm-1,d,9).getTime(),recur:r.id});
          made++;
        }
        r.last=y+"-"+pad(m); changed=true;
      }
    }
    if(changed) await saveSettings(c);
    if(made){ toast("고정 내역 "+made+"건을 자동으로 넣었어요"); if((c.assets||[]).some(x=>x.link)) setTimeout(()=>saveAssets(clone(cfg().assets)),400); }
  }catch(e){ console.log("recurring", e); }
  finally{ recurBusy=false; }
}
let readyRan=false;
function dataReady(){
  if(!S.loaded || !S.setLoaded) return;
  if(!S.navTouched && !readyRan){ const [y,m]=periodOf(todayStr()); S.y=y; S.m=m; render(); }
  if(!readyRan){ readyRan=true; setTimeout(runRecurring, 600); }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && readyRan) setTimeout(runRecurring, 600); });

/* ---------- nav ---------- */
$("prev").addEventListener("click", ()=>{ S.navTouched=true; });
$("next").addEventListener("click", ()=>{ S.navTouched=true; });
$("prev").onclick = ()=>{ if(--S.m<1){S.m=12;S.y--;} render(); };
$("next").onclick = ()=>{ if(++S.m>12){S.m=1;S.y++;} render(); };
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; S.confirmDel=null; render(); $("main").scrollTop=0; });
$("fab").onclick = ()=>openSheet(null);

/* ---------- local store (이 기기에만 저장) ---------- */
const LocalStore = (()=>{
  const KEY="gagyebu-v1"; let ok=true;
  const load=()=>{ try{ const v=JSON.parse(localStorage.getItem(KEY)); return v&&v.tx?v:{settings:null,tx:{}}; }catch(e){ ok=false; return {settings:null,tx:{}}; } };
  let D = load(); const subS=[], subT=[];
  const persist=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){ toast("저장하지 못했어요. 저장 공간을 확인하세요."); throw e; } };
  const snapS=()=>({exists:!!D.settings, data:()=>D.settings, metadata:{fromCache:false}});
  const snapT=()=>({docs:Object.keys(D.tx).map(id=>({id, data:()=>D.tx[id]})), metadata:{fromCache:false}});
  const emit=()=>{ subS.forEach(f=>f(snapS())); subT.forEach(f=>f(snapT())); };
  window.addEventListener("storage", e=>{ if(e.key===KEY){ D=load(); emit(); } });
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  return {
    ok:()=>ok,
    setDoc:{ set:async v=>{ D.settings=v; persist(); emit(); }, onSnapshot:n=>{ subS.push(n); setTimeout(()=>n(snapS()),0); return ()=>{}; } },
    txCol:{
      doc:id=>({ set:async v=>{ D.tx[id]=v; persist(); emit(); }, delete:async()=>{ delete D.tx[id]; persist(); emit(); } }),
      add:async v=>{ D.tx[newId()]=v; persist(); emit(); },
      onSnapshot:n=>{ subT.push(n); setTimeout(()=>n(snapT()),0); return ()=>{}; }
    },
    replaceAll:(settings, tx)=>{ D={settings, tx}; persist(); emit(); },
    addMany:(tx)=>{ Object.assign(D.tx, tx); persist(); emit(); }
  };
})();

/* ---------- nav boot ---------- */
S.db = {};
S.setDoc = LocalStore.setDoc; S.txCol = LocalStore.txCol;
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
S.installTip = isIOS && !standalone;
S.setDoc.onSnapshot(snap=>{ if(snap.exists) S.settings = snap.data(); S.setLoaded=true; render(); dataReady(); });
S.txCol.onSnapshot(snap=>{ S.txs = snap.docs.map(d=>({id:d.id, ...d.data()})); S.loaded=true; render(); dataReady(); });
setStatus(LocalStore.ok()? "이 폰에 저장" : "저장 불가");
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
